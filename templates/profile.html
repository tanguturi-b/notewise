<!DOCTYPE html>
<html>
<head>
    <title>Profile - NoteWise</title>
    <script>
    (function() {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<a href="{{ url_for('chat') }}" class="chat-fab" title="Chat with AI">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="7" width="16" height="12" rx="3"></rect>
        <circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"></circle>
        <path d="M12 7V4"></path>
        <circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"></circle>
        <path d="M4 12H2"></path>
        <path d="M22 12h-2"></path>
    </svg>
</a>
<body>
<div class="navbar">
    <h2>NoteWise</h2>
    <div class="navbar-links">
        <a href="{{ url_for('dashboard') }}" class="btn">Back to Notes</a>
        <a href="{{ url_for('logout') }}" class="icon-only-btn" title="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
    </div>
</div>

<div class="form-box">
    <h1>Profile Settings</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="flash flash-{{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <input type="text" name="username" value="{{ current_user.username }}" required>
        <input type="email" name="email" value="{{ current_user.email }}" required>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('dashboard') }}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
