<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - NoteWise</title>
    <script>
    (function() {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-container">
    <div class="auth-box">
        <h1>Create your account</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="flash flash-{{ category }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <label style="display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;">
                <input type="checkbox" name="consent" required style="width:auto; margin-top:2px;">
                I agree to the <a href="{{ url_for('privacy') }}" target="_blank" style="color:var(--spine-dark);">Privacy Policy</a>, including that my note content may be sent to Groq (our AI provider) when I use AI features.
            </label>
            <button type="submit">Sign Up</button>
        </form>
        <span class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></span>
    </div>
</div>
</body>
</html>
