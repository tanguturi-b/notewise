<!DOCTYPE html>
<html>
<head>
    <title>Chat - NoteWise</title>
    <script>
    (function() {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="navbar">
    <h2>NoteWise</h2>
    <div class="navbar-links">
        <a href="{{ url_for('dashboard') }}" class="btn">Back to Notes</a>
        <a href="{{ url_for('logout') }}" class="icon-only-btn" title="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
    </div>
</div>

<div class="container chat-container">
    <div class="chat-header">
        <h1>AI Chat</h1>
        <form method="POST" action="{{ url_for('clear_chat') }}">
            <button type="submit" class="btn">Clear</button>
        </form>
    </div>

    <div class="chat-messages">
        {% if not history %}
            <div class="empty-state">
                <p>Ask me anything.</p>
            </div>
        {% endif %}
        {% for msg in history %}
            <div class="chat-bubble chat-{{ msg.role }}">
                <span class="chat-role">{{ 'You' if msg.role == 'user' else 'AI' }}</span>
                <p>{{ msg.content }}</p>
            </div>
        {% endfor %}
    </div>

    <form method="POST" class="chat-input-form">
        <input type="text" name="message" placeholder="Type a message..." required autofocus>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>
</body>
</html>
