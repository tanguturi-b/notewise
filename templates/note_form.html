<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Edit' if note else 'New' }} Note</title>
    <script>
    (function() {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<a href="{{ url_for('chat') }}" class="chat-fab" title="Chat with AI">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="7" width="16" height="12" rx="3"></rect>
        <circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="15" cy="13" r="1.3" fill="currentColor" stroke="none"></circle>
        <path d="M12 7V4"></path>
        <circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"></circle>
        <path d="M4 12H2"></path>
        <path d="M22 12h-2"></path>
    </svg>
</a>
<body>
<div class="form-box">
    <h1>{{ 'Edit Note' if note else 'New Note' }}</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Title" value="{{ note.title if note else '' }}" required>
        <textarea name="content" placeholder="Write your note... (Markdown supported: **bold**, *italic*, - lists)">{{ note.content if note else '' }}</textarea>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('dashboard') }}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
