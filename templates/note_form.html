<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Edit' if note else 'New' }} Note</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="form-box">
    <h1>{{ 'Edit Note' if note else 'New Note' }}</h1>
    <form method="POST">
        <input type="text" name="title" placeholder="Title" value="{{ note.title if note else '' }}" required>
        <textarea name="content" placeholder="Write your note...">{{ note.content if note else '' }}</textarea>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('home') }}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
