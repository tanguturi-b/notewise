<!DOCTYPE html>
<html>
<head>
    <title>{{ 'Edit' if note else 'New' }} Note</title>
    <script>
    (function() {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="form-box">
    <h1>{{ 'Edit Note' if note else 'New Note' }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="flash flash-{{ category }}" style="white-space: pre-line;">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="title" placeholder="Title" value="{{ note.title if note else '' }}" required>
        <textarea name="content" placeholder="Write your note... (Markdown supported: **bold**, *italic*, - lists)">{{ note.content if note else '' }}</textarea>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('dashboard') }}">Cancel</a>
        </div>
    </form>

    {% if note %}
    <div class="note-ai-tools">
        <form method="POST" action="{{ url_for('summarize_note', note_id=note.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-primary" style="background: var(--spine-dark);"> 
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                Summarize this note
            </button>
        </form>

        <form method="POST" action="{{ url_for('ask_about_note', note_id=note.id) }}" class="ask-ai-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="question" placeholder="Ask AI about this note..." required>
            <button type="submit" class="btn btn-primary">Ask</button>
        </form>
    </div>
    {% endif %}
</div>
</body>
</html>
